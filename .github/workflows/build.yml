# .github/workflows/build.yml

name: "CI — Build, Scan & Push"

on:
  push:
    branches: [main, "feature/**", "hotfix/**"]
    paths:
      - "services/**"
  pull_request:
    branches: [main]
    paths:
      - "services/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build (all/frontend/auth/admin/student/exam/proctoring/notification/ai)"
        required: false
        default: "all"

permissions:
  id-token: write
  contents: write
  security-events: write
  pull-requests: write

env:
  ACR_REGISTRY: acrclahanacademy.azurecr.io

jobs:
  detect-changes:
    name: "Detect Changed Services"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        run: |
          declare -A DIRECTORIES=(
            ["frontend"]="services/frontend-service"
            ["auth"]="services/auth-service"
            ["admin"]="services/admin-service"
            ["student"]="services/student-service"
            ["exam"]="services/exam-service"
            ["proctoring"]="services/proctoring-service"
            ["notification"]="services/notification-service"
            ["ai"]="services/ai-service"
          )

          declare -A PORTS=(
            ["frontend"]="5173"
            ["auth"]="4001"
            ["admin"]="4002"
            ["student"]="4003"
            ["exam"]="4004"
            ["proctoring"]="4005"
            ["notification"]="4006"
            ["ai"]="8000"
          )

          declare -A LANGUAGES=(
            ["frontend"]="node"
            ["auth"]="node"
            ["admin"]="node"
            ["student"]="node"
            ["exam"]="node"
            ["proctoring"]="node"
            ["notification"]="node"
            ["ai"]="python"
          )

          MATRIX_ITEMS=()

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVICE="${{ github.event.inputs.service }}"
            if [ -z "$SERVICE" ] || [ "$SERVICE" = "all" ]; then
              for key in "${!DIRECTORIES[@]}"; do
                MATRIX_ITEMS+=("{\"service\":\"$key\",\"directory\":\"${DIRECTORIES[$key]}\",\"port\":\"${PORTS[$key]}\",\"language\":\"${LANGUAGES[$key]}\"}")
              done
            else
              MATRIX_ITEMS+=("{\"service\":\"$SERVICE\",\"directory\":\"${DIRECTORIES[$SERVICE]}\",\"port\":\"${PORTS[$SERVICE]}\",\"language\":\"${LANGUAGES[$SERVICE]}\"}")
            fi
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
            else
              if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
              else
                CHANGED_FILES=$(git show --name-only --format="")
              fi
            fi

            echo "Changed files:"
            echo "$CHANGED_FILES"

            for key in "${!DIRECTORIES[@]}"; do
              DIR="${DIRECTORIES[$key]}"
              if echo "$CHANGED_FILES" | grep -q "^${DIR}/"; then
                MATRIX_ITEMS+=("{\"service\":\"$key\",\"directory\":\"$DIR\",\"port\":\"${PORTS[$key]}\",\"language\":\"${LANGUAGES[$key]}\"}")
              fi
            done
          fi

          if [ ${#MATRIX_ITEMS[@]} -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
          else
            MATRIX_JSON="{\"include\":["
            for i in "${!MATRIX_ITEMS[@]}"; do
              if [ $i -gt 0 ]; then
                MATRIX_JSON="${MATRIX_JSON},"
              fi
              MATRIX_JSON="${MATRIX_JSON}${MATRIX_ITEMS[$i]}"
            done
            MATRIX_JSON="${MATRIX_JSON}]}"
            
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "matrix=${MATRIX_JSON}" >> $GITHUB_OUTPUT
          fi

  snyk-scan:
    name: "Snyk — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Snyk token from Key Vault
        id: get-snyk-token
        run: |
          SNYK_TOKEN=$(az keyvault secret show \
            --vault-name kv-clahan-academy \
            --name snyk-token \
            --query value -o tsv)
          echo "::add-mask::$SNYK_TOKEN"
          echo "SNYK_TOKEN=$SNYK_TOKEN" >> $GITHUB_ENV

      - name: Setup Node.js
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (Node)
        if: matrix.language == 'node'
        working-directory: ${{ matrix.directory }}
        run: npm ci --legacy-peer-deps

      - name: Install dependencies (Python)
        if: matrix.language == 'python'
        working-directory: ${{ matrix.directory }}
        run: pip install -r requirements.txt

      - name: Run Snyk scan (Node)
        if: matrix.language == 'node'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --file=${{ matrix.directory }}/package.json
            --project-name=clahan-${{ matrix.service }}
          json: true
        continue-on-error: true

      - name: Run Snyk scan (Python)
        if: matrix.language == 'python'
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --file=${{ matrix.directory }}/requirements.txt
            --project-name=clahan-${{ matrix.service }}
        continue-on-error: true

  sonarcloud:
    name: "SonarCloud Analysis"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get SonarCloud token from Key Vault
        run: |
          SONAR_TOKEN=$(az keyvault secret show \
            --vault-name kv-clahan-academy \
            --name sonar-token \
            --query value -o tsv)
          echo "::add-mask::$SONAR_TOKEN"
          echo "SONAR_TOKEN=$SONAR_TOKEN" >> $GITHUB_ENV

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=clahan-academy
            -Dsonar.organization=clahan-academy
            -Dsonar.sources=services
            -Dsonar.exclusions=**/node_modules/**,**/.git/**,**/dist/**,**/__pycache__/**,**/venv/**

  build:
    name: "Build — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [detect-changes, snyk-scan, sonarcloud]
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name acrclahanacademy

      - name: Generate image metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "image=acrclahanacademy.azurecr.io/clahan-${{ matrix.service }}" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.directory }}
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/M-VIGNESH3/clahan-academy

      - name: Save image tar for Trivy
        run: |
          docker save ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }} \
            -o /tmp/image-${{ matrix.service }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ steps.meta.outputs.sha }}
          path: /tmp/image-${{ matrix.service }}.tar
          retention-days: 1

  trivy-scan:
    name: "Trivy — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ needs.build.outputs.image_tag }}
          path: /tmp/

      - name: Load Docker image
        run: docker load -i /tmp/image-${{ matrix.service }}.tar

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/image-${{ matrix.service }}.tar
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  push-to-acr:
    name: "Push — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [detect-changes, build, trivy-scan]
    if: |
      needs.detect-changes.outputs.has_changes == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ needs.build.outputs.image_tag }}
          path: /tmp/

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name acrclahanacademy

      - name: Download and push image
        run: |
          SHA=$(git rev-parse --short HEAD)
          IMAGE="acrclahanacademy.azurecr.io/clahan-${{ matrix.service }}"
          
          docker load -i /tmp/image-${{ matrix.service }}.tar || true
          
          docker push ${IMAGE}:${SHA}
          docker tag ${IMAGE}:${SHA} ${IMAGE}:latest
          docker push ${IMAGE}:latest
          
          echo "✅ Pushed ${IMAGE}:${SHA}"

  update-helm-values:
    name: "Update Helm — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [detect-changes, push-to-acr]
    if: |
      needs.detect-changes.outputs.has_changes == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Update image tag in Helm values
        run: |
          SHA=$(git rev-parse --short HEAD)
          VALUES_FILE="helm/clahan-academy/values.yaml"
          
          yq eval ".${{ matrix.service }}.image.tag = \"${SHA}\"" \
            -i ${VALUES_FILE}
          
          echo "✅ Updated ${{ matrix.service }} image tag to ${SHA}"

      - name: Commit and push
        run: |
          SHA=$(git rev-parse --short HEAD)
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add helm/clahan-academy/values.yaml
          git diff --staged --quiet || \
            git commit -m "chore: update ${{ matrix.service }} image to ${SHA} [skip ci]"
          git push
