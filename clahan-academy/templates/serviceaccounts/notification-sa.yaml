apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "clahan.fullname" . }}-notification
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clahan.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification
  annotations:
    azure.workload.identity/use: "true"
    azure.workload.identity/client-id: {{ .Values.azure.workloadIdentity.notification.clientId | quote }}
automountServiceAccountToken: true
