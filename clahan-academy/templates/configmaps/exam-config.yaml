apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clahan.fullname" . }}-exam
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clahan.labels" . | nindent 4 }}
    app.kubernetes.io/component: exam
data:
  PORT: "4004"
  NODE_ENV: {{ .Values.global.environment | quote }}
  AI_SERVICE_URL: {{ .Values.exam.config.aiServiceUrl | quote }}
  JUDGE0_URL: {{ .Values.exam.config.judge0Url | quote }}
