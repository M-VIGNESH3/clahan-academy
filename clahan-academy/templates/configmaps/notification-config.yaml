apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clahan.fullname" . }}-notification
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clahan.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification
data:
  PORT: "4006"
  NODE_ENV: {{ .Values.global.environment | quote }}
  SMTP_HOST: {{ .Values.notification.config.smtpHost | quote }}
  SMTP_PORT: {{ .Values.notification.config.smtpPort | quote }}
