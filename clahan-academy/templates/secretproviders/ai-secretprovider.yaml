apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "clahan.fullname" . }}-ai-spc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clahan.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useClientID: "true"
    clientID: {{ .Values.azure.workloadIdentity.ai.clientId | quote }}
    keyvaultName: {{ .Values.azure.keyVaultName | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: ollama-url
          objectType: secret
        - |
          objectName: blob-storage-account
          objectType: secret
        - |
          objectName: blob-storage-key
          objectType: secret
  secretObjects:
    - secretName: {{ include "clahan.fullname" . }}-ai-secret
      type: Opaque
      data:
        - objectName: ollama-url
          key: OLLAMA_URL
        - objectName: blob-storage-account
          key: AZURE_STORAGE_ACCOUNT
        - objectName: blob-storage-key
          key: AZURE_STORAGE_KEY
