{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "clahan.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clahan.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
    # Enable WebSockets & stickiness for Proctoring (Socket.IO)
    appgw.ingress.kubernetes.io/cookie-based-affinity: "true"
    appgw.ingress.kubernetes.io/backend-protocol: "http"
spec:
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ include "clahan.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/auth/*
            pathType: Prefix
            backend:
              service:
                name: {{ include "clahan.fullname" . }}-auth
                port:
                  name: http
          - path: /api/admin/*
            pathType: Prefix
            backend:
              service:
                name: {{ include "clahan.fullname" . }}-admin
                port:
                  name: http
          - path: /api/student/*
            pathType: Prefix
            backend:
              service:
                name: {{ include "clahan.fullname" . }}-student
                port:
                  name: http
          - path: /api/exams/*
            pathType: Prefix
            backend:
              service:
                name: {{ include "clahan.fullname" . }}-exam
                port:
                  name: http
          - path: /api/proctor/*
            pathType: Prefix
            backend:
              service:
                name: {{ include "clahan.fullname" . }}-proctoring
                port:
                  name: http
          - path: /api/notifications/*
            pathType: Prefix
            backend:
              service:
                name: {{ include "clahan.fullname" . }}-notification
                port:
                  name: http
          - path: /*
            pathType: Prefix
            backend:
              service:
                name: {{ include "clahan.fullname" . }}-frontend
                port:
                  name: http
{{- end }}
