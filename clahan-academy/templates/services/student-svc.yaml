apiVersion: v1
kind: Service
metadata:
  name: {{ include "clahan.fullname" . }}-student
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clahan.labels" . | nindent 4 }}
    app.kubernetes.io/component: student
spec:
  type: {{ if eq "student" "frontend" }}NodePort{{ else }}ClusterIP{{ end }}
  ports:
    - name: http
      port: 4003
      targetPort: 4003
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "clahan.name" . }}-student
    app.kubernetes.io/instance: {{ .Release.Name }}
