apiVersion: v1
kind: Service
metadata:
  name: {{ include "clahan.fullname" . }}-ollama
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clahan.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  type: {{ if eq "ollama" "frontend" }}NodePort{{ else }}ClusterIP{{ end }}
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "clahan.name" . }}-ollama
    app.kubernetes.io/instance: {{ .Release.Name }}
